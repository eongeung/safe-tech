{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1>회원가입</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">회원가입</button>
</form>
{% if form.errors %}
    <ul>
    {% for field in form %}
        {% for error in field.errors %}
            <li>{{ field.label }}: {{ error }}</li>
        {% endfor %}
    {% endfor %}
    </ul>
{% endif %}
<p>이미 계정이 있으신가요? <a href="{% url 'login' %}">로그인</a></p>
{% endblock %}

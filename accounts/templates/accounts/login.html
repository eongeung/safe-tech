{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-body">
                    <h1 class="h3 mb-3 text-center" style="color: rgb(102, 102, 228); font-weight: bold;">SAFE-TECH</h1>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-1">로그인</button>
                    </form>
                    <p class="text-center mt-3">계정이 없으신가요? <a href="{% url 'signup' %}">회원가입</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
